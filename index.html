<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Мій курс JavaScript</title>
    <script>
      var last = null;
      try {
        var _raw = localStorage.getItem("jscourse.lastPage");
        if (_raw) { try { last = JSON.parse(_raw); } catch (e) { last = _raw; } }
        if (last) {
          // повний URL → витягуємо тільки частину після /pages/
          var m = last.match(/\/(pages\/.+)$/);
          if (m) { last = m[1]; }
          // абсолютний шлях /pages/... → робимо відносним
          else if (last[0] === "/") { last = last.slice(1); }
        }
      } catch (e) {}
      window.location.replace(last || "pages/intro.html");
    </script>
  </head>
  <body></body>
</html>
