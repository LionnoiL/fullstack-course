<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мої нотатки · JS Course</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
<h1 id="нотатки">Мої нотатки</h1>
<p class="notes-count" id="notes-count"></p>
<p class="notes-empty" id="notes-empty" style="display:none">
  Ти ще не додав жодної нотатки. Відкрий будь-який урок, натисни кнопку
  «Нотатки» внизу праворуч і запиши свої думки — усі вони зберуться тут, і
  звідси можна буде швидко перейти до відповідного уроку.
</p>
<div class="notes-list" id="notes-list"></div>
  </main>
</div>
<script src="../js/nav.js"></script>
<script src="../js/search-index.js"></script>
<script src="../js/search.js"></script>
<script>
(function () {
  "use strict";
  const listEl = document.getElementById("notes-list");
  const emptyEl = document.getElementById("notes-empty");
  const countEl = document.getElementById("notes-count");

  let notes = {};
  try {
    notes = JSON.parse(localStorage.getItem("jscourse.notes")) || {};
  } catch (e) {
    notes = {};
  }

  // Довідник href → { title, section, order } зі структури курсу.
  const lookup = {};
  let order = 0;
  (window.COURSE_SECTIONS || []).forEach((s) => {
    s.lessons.forEach(([href, title]) => {
      lookup[href] = { title: title, section: s.title, order: order++ };
    });
  });

  const entries = Object.keys(notes)
    .filter((href) => notes[href] && notes[href].trim() && lookup[href])
    .sort((a, b) => lookup[a].order - lookup[b].order);

  if (!entries.length) {
    emptyEl.style.display = "block";
    countEl.textContent = "Поки що порожньо.";
    return;
  }

  countEl.textContent =
    "Збережено нотаток: " + entries.length;

  entries.forEach((href) => {
    const info = lookup[href];

    const card = document.createElement("div");
    card.className = "note-card";

    const head = document.createElement("div");
    head.className = "note-card-head";

    const section = document.createElement("span");
    section.className = "note-card-section";
    section.textContent = info.section;

    const title = document.createElement("a");
    title.className = "note-card-title";
    title.href = href;
    title.textContent = info.title;

    const go = document.createElement("a");
    go.className = "note-card-go";
    go.href = href;
    go.textContent = "Перейти до уроку →";

    head.appendChild(section);
    head.appendChild(title);
    head.appendChild(go);

    const text = document.createElement("p");
    text.className = "note-card-text";
    text.textContent = notes[href];

    card.appendChild(head);
    card.appendChild(text);
    listEl.appendChild(card);
  });
})();
</script>
</body>
</html>
