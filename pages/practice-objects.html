<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика: об'єкти · JS Course</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="../js/practice.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
<h1 id="практика">Практика: об'єкти та колекції</h1>
<p>Об'єкти, <code>Object.entries</code>, <code>Map</code>/<code>Set</code>, деструктуризація. Пиши код і
тисни <strong>«Запустити»</strong>.</p>
<div id="tasks"></div>
<script>
Practice.load('tasks', [
  {
    title: 'pick — вибрати поля',
    desc: '<code>pick(obj, keys)</code> → новий об’єкт лише з переліченими полями.',
    entry: 'pick',
    starter: 'function pick(obj, keys) {\n  \n}',
    solution: 'function pick(obj, keys) {\n  return keys.reduce((acc, key) => {\n    if (key in obj) acc[key] = obj[key];\n    return acc;\n  }, {});\n}',
    tests: [
      { name: "pick({a:1,b:2,c:3}, ['a','c'])", test: (e) => JSON.stringify(e.pick({a:1,b:2,c:3}, ['a','c'])) === JSON.stringify({a:1,c:3}) },
      { name: 'ігнорує відсутні ключі', test: (e) => JSON.stringify(e.pick({a:1}, ['a','x'])) === JSON.stringify({a:1}) },
    ],
  },
  {
    title: 'omit — прибрати поля',
    desc: '<code>omit(obj, keys)</code> → об’єкт без перелічених полів.',
    entry: 'omit',
    starter: 'function omit(obj, keys) {\n  \n}',
    solution: 'function omit(obj, keys) {\n  return Object.fromEntries(\n    Object.entries(obj).filter(([k]) => !keys.includes(k)),\n  );\n}',
    tests: [
      { name: "omit({a:1,b:2,c:3}, ['b'])", test: (e) => JSON.stringify(e.omit({a:1,b:2,c:3}, ['b'])) === JSON.stringify({a:1,c:3}) },
    ],
  },
  {
    title: 'Підрахунок слів',
    desc: '<code>wordCount(str)</code> → об’єкт з кількістю кожного слова (розділені пробілом).',
    entry: 'wordCount',
    starter: 'function wordCount(str) {\n  \n}',
    solution: "function wordCount(str) {\n  return str.split(' ').reduce((acc, word) => {\n    acc[word] = (acc[word] || 0) + 1;\n    return acc;\n  }, {});\n}",
    tests: [
      { name: "wordCount('a b a') → {a:2,b:1}", test: (e) => { const r = e.wordCount('a b a'); return r.a === 2 && r.b === 1; } },
    ],
  },
  {
    title: 'Інвертувати об’єкт',
    desc: '<code>invert(obj)</code> → поміняти місцями ключі й значення.',
    entry: 'invert',
    starter: 'function invert(obj) {\n  \n}',
    solution: 'function invert(obj) {\n  const result = {};\n  for (const [key, value] of Object.entries(obj)) {\n    result[value] = key;\n  }\n  return result;\n}',
    tests: [
      { name: "invert({a:'x',b:'y'})", test: (e) => { const r = e.invert({a:'x',b:'y'}); return r.x === 'a' && r.y === 'b'; } },
    ],
  },
  {
    title: 'mapValues',
    desc: '<code>mapValues(obj, fn)</code> → об’єкт із тими ж ключами, значення пропущені через fn.',
    entry: 'mapValues',
    starter: 'function mapValues(obj, fn) {\n  \n}',
    solution: 'function mapValues(obj, fn) {\n  return Object.fromEntries(\n    Object.entries(obj).map(([k, v]) => [k, fn(v)]),\n  );\n}',
    tests: [
      { name: 'mapValues({a:1,b:2}, x=>x*2)', test: (e) => JSON.stringify(e.mapValues({a:1,b:2}, (x) => x * 2)) === JSON.stringify({a:2,b:4}) },
    ],
  },
  {
    title: 'fromPairs',
    desc: '<code>fromPairs(pairs)</code> → об’єкт із масиву пар [ключ, значення].',
    entry: 'fromPairs',
    starter: 'function fromPairs(pairs) {\n  \n}',
    solution: 'function fromPairs(pairs) {\n  return Object.fromEntries(pairs);\n}',
    tests: [
      { name: "fromPairs([['a',1],['b',2]])", test: (e) => JSON.stringify(e.fromPairs([['a',1],['b',2]])) === JSON.stringify({a:1,b:2}) },
    ],
  },
  {
    title: 'Глибоке копіювання',
    desc: '<code>deepClone(obj)</code> → незалежна глибока копія (без функцій).',
    entry: 'deepClone',
    starter: 'function deepClone(obj) {\n  \n}',
    hint: 'JSON.parse(JSON.stringify(obj)).',
    solution: 'function deepClone(obj) {\n  return JSON.parse(JSON.stringify(obj));\n}',
    tests: [
      { name: 'зміна копії не чіпає оригінал', test: (e) => { const o = {a:{b:1}}; const c = e.deepClone(o); c.a.b = 9; return o.a.b === 1; } },
    ],
  },
  {
    title: 'Значення за замовчуванням',
    desc: '<code>mergeDefaults(obj, defaults)</code> → відсутні поля беруться з defaults.',
    entry: 'mergeDefaults',
    starter: 'function mergeDefaults(obj, defaults) {\n  \n}',
    solution: 'function mergeDefaults(obj, defaults) {\n  return { ...defaults, ...obj };\n}',
    tests: [
      { name: 'додає відсутні', test: (e) => { const r = e.mergeDefaults({a:1}, {a:9,b:2}); return r.a === 1 && r.b === 2; } },
    ],
  },
  {
    title: 'countBy',
    desc: '<code>countBy(arr, fn)</code> → об’єкт: скільки елементів дає кожен ключ fn(item).',
    entry: 'countBy',
    starter: 'function countBy(arr, fn) {\n  \n}',
    solution: 'function countBy(arr, fn) {\n  return arr.reduce((acc, item) => {\n    const k = fn(item);\n    acc[k] = (acc[k] || 0) + 1;\n    return acc;\n  }, {});\n}',
    tests: [
      { name: 'парні/непарні', test: (e) => { const r = e.countBy([1,2,3,4], (x) => x % 2 === 0 ? 'even' : 'odd'); return r.odd === 2 && r.even === 2; } },
    ],
  },
  {
    title: 'isEmpty',
    desc: '<code>isEmpty(obj)</code> → true, якщо в об’єкті немає власних полів.',
    entry: 'isEmpty',
    starter: 'function isEmpty(obj) {\n  \n}',
    solution: 'function isEmpty(obj) {\n  return Object.keys(obj).length === 0;\n}',
    tests: [
      { name: 'isEmpty({}) === true', test: (e) => e.isEmpty({}) === true },
      { name: 'isEmpty({a:1}) === false', test: (e) => e.isEmpty({a:1}) === false },
    ],
  },
]);
</script>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

</html>
