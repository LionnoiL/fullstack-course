<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="20" y="20" width="600" height="320" rx="8" fill="#faf7f0" stroke="#d6d3d1"/>

  <!-- header + nav -->
  <rect x="36" y="36" width="568" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="58" font-size="13" fill="#1e40af" font-family="Consolas, monospace">&lt;header&gt;</text>
  <rect x="150" y="52" width="440" height="30" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="164" y="71" font-size="12" fill="#1e3a8a" font-family="Consolas, monospace">&lt;nav&gt;</text>
  <rect x="360" y="58" width="60" height="18" rx="3" fill="#bfdbfe"/>
  <rect x="430" y="58" width="60" height="18" rx="3" fill="#bfdbfe"/>
  <rect x="500" y="58" width="70" height="18" rx="3" fill="#bfdbfe"/>
  <text x="500" y="42" font-size="11" fill="#57534e">nav → список посилань</text>

  <!-- main: article + aside -->
  <rect x="36" y="108" width="568" height="176" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="50" y="130" font-size="13" fill="#15803d" font-family="Consolas, monospace">&lt;main&gt;</text>

  <rect x="52" y="142" width="380" height="128" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="66" y="163" font-size="12" fill="#166534" font-family="Consolas, monospace">&lt;article&gt;</text>
  <rect x="66" y="176" width="300" height="20" rx="3" fill="#bbf7d0"/>
  <text x="74" y="191" font-size="12" fill="#166534" font-family="Consolas, monospace">&lt;h1&gt; єдиний на сторінку</text>
  <rect x="66" y="204" width="352" height="10" rx="2" fill="#dcfce7"/>
  <rect x="66" y="220" width="352" height="10" rx="2" fill="#dcfce7"/>
  <rect x="66" y="236" width="280" height="10" rx="2" fill="#dcfce7"/>

  <rect x="444" y="142" width="146" height="128" rx="5" fill="#fef9c3" stroke="#eab308"/>
  <text x="458" y="163" font-size="12" fill="#854d0e" font-family="Consolas, monospace">&lt;aside&gt;</text>
  <text x="458" y="184" font-size="11" fill="#854d0e">Схожі статті</text>
  <rect x="458" y="196" width="118" height="10" rx="2" fill="#fef08a"/>
  <rect x="458" y="212" width="118" height="10" rx="2" fill="#fef08a"/>
  <rect x="458" y="228" width="90" height="10" rx="2" fill="#fef08a"/>

  <!-- footer -->
  <rect x="36" y="296" width="568" height="30" rx="6" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="50" y="316" font-size="12" fill="#57534e" font-family="Consolas, monospace">&lt;footer&gt; © 2026</text>
</svg>
