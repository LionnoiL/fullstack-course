<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Shared prototype/methods -->
  <rect x="220" y="20" width="200" height="70" rx="10" fill="#2563eb"/>
  <text x="320" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Car.prototype</text>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#dbeafe">drive(), stop()</text>

  <!-- three instances sharing the prototype -->
  <g>
    <rect x="40" y="220" width="160" height="110" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">car1</text>
    <text x="120" y="272" text-anchor="middle" font-size="12" fill="#6b7280">brand: "Toyota"</text>
    <text x="120" y="292" text-anchor="middle" font-size="12" fill="#6b7280">color: "red"</text>
    <text x="120" y="312" text-anchor="middle" font-size="12" fill="#6b7280">speed: 0</text>
  </g>

  <g>
    <rect x="240" y="220" width="160" height="110" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">car2</text>
    <text x="320" y="272" text-anchor="middle" font-size="12" fill="#6b7280">brand: "Honda"</text>
    <text x="320" y="292" text-anchor="middle" font-size="12" fill="#6b7280">color: "blue"</text>
    <text x="320" y="312" text-anchor="middle" font-size="12" fill="#6b7280">speed: 0</text>
  </g>

  <g>
    <rect x="440" y="220" width="160" height="110" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="520" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">car3</text>
    <text x="520" y="272" text-anchor="middle" font-size="12" fill="#6b7280">brand: "Ford"</text>
    <text x="520" y="292" text-anchor="middle" font-size="12" fill="#6b7280">color: "black"</text>
    <text x="520" y="312" text-anchor="middle" font-size="12" fill="#6b7280">speed: 0</text>
  </g>

  <!-- connecting lines from each instance to shared prototype -->
  <line x1="120" y1="220" x2="290" y2="92" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="320" y1="220" x2="320" y2="92" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="520" y1="220" x2="350" y2="92" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="320" y="185" text-anchor="middle" font-size="12" fill="#9ca3af" font-style="italic">кожен об'єкт має власні дані, але спільні методи</text>
</svg>
