<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- the card -->
  <rect x="230" y="24" width="180" height="252" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
  <!-- image area -->
  <rect x="230" y="24" width="180" height="120" rx="12" fill="#eff6ff"/>
  <rect x="230" y="120" width="180" height="24" fill="#eff6ff"/>
  <path d="M270 110 l24 -28 l20 22 l14 -14 l22 20 z" fill="#bfdbfe"/>
  <circle cx="360" cy="60" r="12" fill="#bfdbfe"/>
  <text x="320" y="86" font-size="10" fill="#93c5fd" text-anchor="middle">зображення</text>

  <!-- title -->
  <rect x="248" y="160" width="120" height="14" rx="3" fill="#44403c"/>
  <text x="248" y="171" font-size="9" fill="#ffffff" font-family="Consolas, monospace">  Назва товару</text>
  <!-- desc line -->
  <rect x="248" y="182" width="144" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>

  <!-- price -->
  <text x="248" y="216" font-size="18" fill="#16a34a" font-weight="700">₴ 499</text>

  <!-- button -->
  <rect x="248" y="232" width="144" height="30" rx="8" fill="#2563eb"/>
  <text x="320" y="252" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Купити</text>

  <!-- annotations -->
  <text x="60" y="60" font-size="11" fill="#78716c">скруглені кути,</text>
  <text x="60" y="76" font-size="11" fill="#78716c">легка тінь,</text>
  <text x="60" y="92" font-size="11" fill="#78716c">відступи всередині</text>
  <line x1="150" y1="80" x2="226" y2="90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="452" y="200" font-size="11" fill="#78716c">ціна — акцент,</text>
  <text x="452" y="216" font-size="11" fill="#78716c">кнопка на всю</text>
  <text x="452" y="232" font-size="11" fill="#78716c">ширину картки</text>
  <line x1="414" y1="245" x2="448" y2="222" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
