<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="j1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="j2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
