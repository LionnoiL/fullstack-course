    <rect x="66" y="334" width="120" height="8" rx="2" fill="#fef9c3" stroke="#fde68a"/>
    <rect x="66" y="348" width="90" height="8" rx="2" fill="#fef9c3" stroke="#fde68a"/>
  </g>
  <g>
    <rect x="230" y="262" width="180" height="110" rx="6" fill="#fef9c3" stroke="#eab308"/>
    <circle cx="320" cy="292" r="14" fill="#fde68a"/>
