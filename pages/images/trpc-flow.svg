<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- server -->
  <rect x="20" y="40" width="230" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="135" y="66" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="600">Сервер</text>
  <rect x="38" y="80" width="194" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="50" y="100" font-size="12" fill="#1e3a8a" font-family="Consolas, monospace">appRouter = {</text>
  <text x="66" y="118" font-size="12" fill="#1e3a8a" font-family="Consolas, monospace">user, post</text>
  <text x="50" y="134" font-size="12" fill="#1e3a8a" font-family="Consolas, monospace">}</text>
  <rect x="38" y="150" width="194" height="52" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="50" y="170" font-size="11" fill="#854d0e" font-family="Consolas, monospace">.input(z.object(...))</text>
  <text x="50" y="190" font-size="11" fill="#854d0e" font-family="Consolas, monospace">.query() / .mutation()</text>

  <!-- arrow with type -->
  <line x1="250" y1="130" x2="388" y2="130" stroke="#6366f1" stroke-width="2.5" marker-end="url(#ta)"/>
  <rect x="262" y="94" width="118" height="34" rx="6" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="321" y="115" font-size="11" fill="#3730a3" text-anchor="middle" font-family="Consolas, monospace">type AppRouter</text>
  <text x="321" y="150" font-size="10.5" fill="#57534e" text-anchor="middle">лише тип — стирається</text>
  <text x="321" y="164" font-size="10.5" fill="#57534e" text-anchor="middle">на збірці, 0 kB рантайму</text>

  <!-- client -->
  <rect x="390" y="40" width="230" height="180" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="505" y="66" font-size="14" fill="#15803d" text-anchor="middle" font-weight="600">Клієнт</text>
  <rect x="408" y="80" width="194" height="60" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="420" y="104" font-size="11" fill="#166534" font-family="Consolas, monospace">trpc.user.list</text>
  <text x="420" y="122" font-size="11" fill="#166534" font-family="Consolas, monospace">  .useQuery()</text>
  <rect x="408" y="150" width="194" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="420" y="170" font-size="11" fill="#15803d">✓ автодоповнення</text>
  <text x="420" y="190" font-size="11" fill="#15803d">✓ типи input/output</text>

  <text x="320" y="238" font-size="11" fill="#78716c" text-anchor="middle">Без кодогенерації, без OpenAPI-схем, без ручного дублювання типів</text>
</svg>
