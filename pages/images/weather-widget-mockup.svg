<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- widget frame -->
  <rect x="200" y="30" width="240" height="240" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>

  <!-- input + button -->
  <rect x="220" y="52" width="150" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="232" y="74" font-size="12" fill="#a8a29e">Місто…</text>
  <rect x="378" y="52" width="42" height="34" rx="7" fill="#2563eb"/>
  <path d="M392 63 a7 7 0 1 0 0.01 0 M403 74 l4 4" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- result card -->
  <rect x="220" y="102" width="200" height="150" rx="10" fill="#ffffff" stroke="#e0f2fe"/>
  <text x="240" y="134" font-size="16" fill="#0c4a6e" font-weight="600">Київ</text>
  <!-- sun icon -->
  <circle cx="370" cy="128" r="14" fill="#fde68a"/>
  <g stroke="#fbbf24" stroke-width="2">
    <line x1="370" y1="104" x2="370" y2="110"/>
    <line x1="370" y1="146" x2="370" y2="152"/>
    <line x1="346" y1="128" x2="352" y2="128"/>
    <line x1="388" y1="128" x2="394" y2="128"/>
  </g>
  <text x="240" y="188" font-size="34" fill="#0369a1" font-weight="700">+21°</text>
  <text x="240" y="214" font-size="12" fill="#57534e">Ясно, вітер 3 м/с</text>
  <rect x="240" y="226" width="160" height="8" rx="2" fill="#f0f9ff" stroke="#e0f2fe"/>

  <!-- annotations -->
  <text x="40" y="80" font-size="11" fill="#78716c">поле вводу</text>
  <text x="40" y="96" font-size="11" fill="#78716c">+ кнопка «пошук»</text>
  <line x1="130" y1="82" x2="216" y2="70" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="470" y="180" font-size="11" fill="#78716c">результат: місто,</text>
  <text x="470" y="196" font-size="11" fill="#78716c">температура, опис;</text>
  <text x="470" y="212" font-size="11" fill="#78716c">+ стани «завантаження»</text>
  <text x="470" y="228" font-size="11" fill="#78716c">та «місто не знайдено»</text>
  <line x1="424" y1="180" x2="466" y2="176" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
