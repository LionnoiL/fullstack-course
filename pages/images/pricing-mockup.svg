<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="30" font-size="13" fill="#1c1917" text-anchor="middle" font-weight="600">Три тарифи · «популярний» виділено</text>

  <!-- card 1 -->
  <rect x="40" y="70" width="170" height="210" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="125" y="102" font-size="13" fill="#44403c" text-anchor="middle" font-weight="600">Базовий</text>
  <text x="125" y="138" font-size="22" fill="#1c1917" text-anchor="middle" font-weight="700">₴0</text>
  <rect x="60" y="158" width="130" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="60" y="176" width="130" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="60" y="194" width="100" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="60" y="230" width="130" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="125" y="250" font-size="11" fill="#57534e" text-anchor="middle">Обрати</text>

  <!-- card 2 (popular, highlighted) -->
  <rect x="235" y="56" width="170" height="238" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="300" y="44" width="40" height="20" rx="10" fill="#2563eb"/>
  <text x="320" y="58" font-size="9" fill="#ffffff" text-anchor="middle">ХІТ</text>
  <text x="320" y="96" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">Про</text>
  <text x="320" y="134" font-size="22" fill="#1e3a8a" text-anchor="middle" font-weight="700">₴299</text>
  <rect x="255" y="156" width="130" height="8" rx="2" fill="#dbeafe"/>
  <rect x="255" y="174" width="130" height="8" rx="2" fill="#dbeafe"/>
  <rect x="255" y="192" width="100" height="8" rx="2" fill="#dbeafe"/>
  <rect x="255" y="210" width="115" height="8" rx="2" fill="#dbeafe"/>
  <rect x="255" y="244" width="130" height="32" rx="8" fill="#2563eb"/>
  <text x="320" y="265" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Обрати</text>

  <!-- card 3 -->
  <rect x="430" y="70" width="170" height="210" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="515" y="102" font-size="13" fill="#44403c" text-anchor="middle" font-weight="600">Бізнес</text>
  <text x="515" y="138" font-size="22" fill="#1c1917" text-anchor="middle" font-weight="700">₴999</text>
  <rect x="450" y="158" width="130" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="450" y="176" width="130" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="450" y="194" width="100" height="8" rx="2" fill="#f5f5f4" stroke="#e7e5e4"/>
  <rect x="450" y="230" width="130" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="515" y="250" font-size="11" fill="#57534e" text-anchor="middle">Обрати</text>
</svg>
