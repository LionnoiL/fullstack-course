<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534e"/>
    </marker>
  </defs>
  <rect x="180" y="30" width="280" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="320" y="62" font-size="15" fill="#1e3a8a" text-anchor="middle">factorial(3) = 3 * factorial(2)</text>
  <rect x="180" y="130" width="280" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="320" y="162" font-size="15" fill="#1e3a8a" text-anchor="middle">factorial(2) = 2 * factorial(1)</text>
  <rect x="180" y="230" width="280" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="320" y="262" font-size="15" fill="#15803d" text-anchor="middle">factorial(1) = 1 (базовий випадок)</text>
  <line x1="150" y1="82" x2="150" y2="230" stroke="#57534e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="120" y="160" font-size="13" fill="#57534e" text-anchor="middle" transform="rotate(-90 120 160)">виклики ↓</text>
  <line x1="490" y1="256" x2="490" y2="108" stroke="#57534e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="520" y="180" font-size="13" fill="#57534e" text-anchor="middle" transform="rotate(-90 520 180)">повернення ↑</text>
  <text x="475" y="205" font-size="13" fill="#78716c" text-anchor="end">1</text>
  <text x="475" y="105" font-size="13" fill="#78716c" text-anchor="end">2 → 6</text>
</svg>
