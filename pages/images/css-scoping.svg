<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>

  <!-- LEFT: global CSS collision -->
  <text x="20" y="30" font-size="13" fill="#b91c1c" font-weight="600">Глобальний CSS</text>
  <rect x="20" y="44" width="130" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="34" y="64" font-size="11" fill="#991b1b" font-family="Consolas, monospace">card.css</text>
  <text x="34" y="82" font-size="11" fill="#7f1d1d" font-family="Consolas, monospace">.title{</text>
  <text x="34" y="97" font-size="11" fill="#7f1d1d" font-family="Consolas, monospace">  color:red }</text>

  <rect x="170" y="44" width="130" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="184" y="64" font-size="11" fill="#991b1b" font-family="Consolas, monospace">post.css</text>
  <text x="184" y="82" font-size="11" fill="#7f1d1d" font-family="Consolas, monospace">.title{</text>
  <text x="184" y="97" font-size="11" fill="#7f1d1d" font-family="Consolas, monospace">  color:blue }</text>

  <path d="M150 74 L170 74" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="128" font-size="20" fill="#dc2626" text-anchor="middle">⚡</text>
  <rect x="60" y="140" width="200" height="52" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="160" y="162" font-size="12" fill="#991b1b" text-anchor="middle">однакове імʼя `.title`</text>
  <text x="160" y="180" font-size="12" fill="#991b1b" text-anchor="middle">→ конфлікт, «хто останній»</text>

  <text x="160" y="228" font-size="11" fill="#78716c" text-anchor="middle">усі класи в одному</text>
  <text x="160" y="244" font-size="11" fill="#78716c" text-anchor="middle">просторі імен —</text>
  <text x="160" y="260" font-size="11" fill="#78716c" text-anchor="middle">стилі течуть і ламаються</text>

  <!-- divider -->
  <line x1="320" y1="20" x2="320" y2="320" stroke="#e7e5e4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT: scoped CSS Modules -->
  <text x="360" y="30" font-size="13" fill="#15803d" font-weight="600">CSS Modules (локальні)</text>
  <rect x="360" y="44" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="374" y="64" font-size="10.5" fill="#166534" font-family="Consolas, monospace">card.module.css</text>
  <text x="374" y="82" font-size="11" fill="#14532d" font-family="Consolas, monospace">.title{</text>
  <text x="374" y="97" font-size="11" fill="#14532d" font-family="Consolas, monospace">  color:red }</text>

  <rect x="510" y="44" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="524" y="64" font-size="10.5" fill="#166534" font-family="Consolas, monospace">post.module.css</text>
  <text x="524" y="82" font-size="11" fill="#14532d" font-family="Consolas, monospace">.title{</text>
  <text x="524" y="97" font-size="11" fill="#14532d" font-family="Consolas, monospace">  color:blue }</text>

  <text x="500" y="132" font-size="14" fill="#16a34a" text-anchor="middle">✓ білдер робить імена унікальними</text>
  <rect x="360" y="150" width="130" height="42" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="425" y="176" font-size="10.5" fill="#166534" text-anchor="middle" font-family="Consolas, monospace">Card_title__a1b2</text>
  <rect x="510" y="150" width="130" height="42" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="575" y="176" font-size="10.5" fill="#166534" text-anchor="middle" font-family="Consolas, monospace">Post_title__c3d4</text>

  <text x="500" y="228" font-size="11" fill="#78716c" text-anchor="middle">кожен клас — свій</text>
  <text x="500" y="244" font-size="11" fill="#78716c" text-anchor="middle">простір імен;</text>
  <text x="500" y="260" font-size="11" fill="#78716c" text-anchor="middle">жодних випадкових конфліктів</text>

  <text x="320" y="304" font-size="11" fill="#57534e" text-anchor="middle">CSS-in-JS вирішує ту саму проблему інакше — генерує унікальні класи з JS-коду компонента</text>
</svg>
