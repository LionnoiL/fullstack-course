<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- Unit (bottom) -->
  <polygon points="200.2,213 439.8,213 500,300 140,300" fill="#dcfce7" stroke="#86efac"/>
  <text x="320" y="252" font-size="15" fill="#15803d" text-anchor="middle" font-weight="600">Unit</text>
  <text x="320" y="272" font-size="11" fill="#166534" text-anchor="middle">окремі функції · Vitest / Jest</text>

  <!-- Integration (middle) -->
  <polygon points="260.5,126 379.5,126 439.8,213 200.2,213" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="320" y="162" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="600">Integration</text>
  <text x="320" y="182" font-size="11" fill="#1e3a8a" text-anchor="middle">кілька частин разом · MSW</text>

  <!-- E2E (top) -->
  <polygon points="320,40 260.5,126 379.5,126" fill="#fef9c3" stroke="#eab308"/>
  <text x="320" y="108" font-size="13" fill="#854d0e" text-anchor="middle" font-weight="600">E2E</text>
  <text x="320" y="30" font-size="11" fill="#854d0e" text-anchor="middle">сценарій користувача · Playwright</text>

  <!-- left axis: speed/cost -->
  <text x="40" y="70" font-size="11" fill="#78716c">вгорі:</text>
  <text x="40" y="86" font-size="11" fill="#78716c">мало,</text>
  <text x="40" y="101" font-size="11" fill="#78716c">повільні,</text>
  <text x="40" y="116" font-size="11" fill="#78716c">дорогі</text>

  <text x="40" y="270" font-size="11" fill="#78716c">внизу:</text>
  <text x="40" y="286" font-size="11" fill="#78716c">багато,</text>
  <text x="40" y="301" font-size="11" fill="#78716c">швидкі,</text>
  <text x="40" y="316" font-size="11" fill="#78716c">дешеві</text>

  <!-- right axis arrow: count grows downward -->
  <line x1="560" y1="60" x2="560" y2="290" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M556 282 L560 292 L564 282 Z" fill="#cbd5e1"/>
  <text x="574" y="120" font-size="11" fill="#78716c" transform="rotate(90 574 120)">більше тестів →</text>
</svg>
