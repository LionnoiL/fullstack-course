<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="360" fill="#282c34" rx="10"/>
  <!-- title bar -->
  <rect width="700" height="36" fill="#21252b" rx="10"/>
  <rect y="26" width="700" height="10" fill="#21252b"/>
  <circle cx="18" cy="18" r="5" fill="#e06c75" opacity="0.8"/>
  <circle cx="36" cy="18" r="5" fill="#e5c07b" opacity="0.8"/>
  <circle cx="54" cy="18" r="5" fill="#98c379" opacity="0.8"/>
  <text x="350" y="23" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#abb2bf">HTML-документ → DOM-дерево</text>

  <!-- === document === -->
  <rect x="260" y="48" width="180" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="350" y="69" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">document</text>

  <line x1="350" y1="80" x2="350" y2="98" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === html === -->
  <rect x="265" y="98" width="170" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="350" y="119" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">&lt;html&gt;</text>

  <!-- branches to head and body -->
  <line x1="350" y1="130" x2="350" y2="145" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="158" y1="145" x2="542" y2="145" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="158" y1="145" x2="158" y2="163" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="542" y1="145" x2="542" y2="163" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === head === -->
  <rect x="90" y="163" width="136" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="158" y="184" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">&lt;head&gt;</text>

  <!-- === body === -->
  <rect x="474" y="163" width="136" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="542" y="184" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">&lt;body&gt;</text>

  <!-- head → title -->
  <line x1="158" y1="195" x2="158" y2="223" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === title === -->
  <rect x="93" y="223" width="130" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="158" y="244" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">&lt;title&gt;</text>

  <!-- title → text "DOM" -->
  <line x1="158" y1="255" x2="158" y2="279" stroke="#4b5263" stroke-width="1.5"/>

  <!-- text node "DOM" -->
  <ellipse cx="158" cy="293" rx="52" ry="18" fill="#1a3320" stroke="#98c379" stroke-width="1.5"/>
  <text x="158" y="298" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#98c379">"DOM"</text>

  <!-- body → div -->
  <line x1="542" y1="195" x2="542" y2="223" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === div === -->
  <rect x="474" y="223" width="136" height="32" rx="6" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="542" y="244" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#61afef">&lt;div&gt;</text>

  <!-- div → h2, p, ul -->
  <line x1="542" y1="255" x2="542" y2="270" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="452" y1="270" x2="632" y2="270" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="452" y1="270" x2="452" y2="288" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="542" y1="270" x2="542" y2="288" stroke="#4b5263" stroke-width="1.5"/>
  <line x1="632" y1="270" x2="632" y2="288" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === h2 === -->
  <rect x="412" y="288" width="80" height="30" rx="5" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="452" y="308" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#61afef">&lt;h2&gt;</text>

  <!-- === p === -->
  <rect x="502" y="288" width="80" height="30" rx="5" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="542" y="308" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#61afef">&lt;p&gt;</text>

  <!-- === ul === -->
  <rect x="592" y="288" width="80" height="30" rx="5" fill="#1e3a5f" stroke="#61afef" stroke-width="1.5"/>
  <text x="632" y="308" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#61afef">&lt;ul&gt;</text>

  <!-- dots under each last node -->
  <text x="452" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b5263">•••</text>
  <text x="542" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b5263">•••</text>
  <text x="632" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b5263">•••</text>

  <!-- Legend -->
  <rect x="10" y="336" width="13" height="13" rx="2" fill="#1e3a5f" stroke="#61afef" stroke-width="1"/>
  <text x="27" y="347" font-family="'Segoe UI',sans-serif" font-size="10" fill="#abb2bf">Вузол-елемент</text>
  <ellipse cx="128" cy="342" rx="11" ry="8" fill="#1a3320" stroke="#98c379" stroke-width="1"/>
  <text x="143" y="347" font-family="'Segoe UI',sans-serif" font-size="10" fill="#abb2bf">Текстовий вузол</text>
</svg>
