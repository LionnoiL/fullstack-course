<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Object.prototype -->
  <rect x="220" y="20" width="200" height="60" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Object.prototype</text>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="#6b7280">toString(), hasOwnProperty()</text>

  <!-- Animal.prototype -->
  <rect x="220" y="140" width="200" height="60" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Animal.prototype</text>
  <text x="320" y="185" text-anchor="middle" font-size="12" fill="#6b7280">eat(), sleep()</text>

  <!-- Dog.prototype -->
  <rect x="220" y="260" width="200" height="60" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Dog.prototype</text>
  <text x="320" y="305" text-anchor="middle" font-size="12" fill="#6b7280">bark()</text>

  <!-- myDog instance -->
  <rect x="220" y="360" width="200" height="50" rx="10" fill="#2563eb"/>
  <text x="320" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">myDog</text>

  <!-- arrows -->
  <line x1="320" y1="140" x2="320" y2="82" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="260" x2="320" y2="202" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="360" x2="320" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="440" y="245" font-size="12" fill="#9ca3af" font-style="italic">__proto__ ↑</text>
</svg>
